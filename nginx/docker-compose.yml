version: '3.3'

services:
  nginx:
    image: nginx:latest
    container_name: nginx
    #restart: always
    volumes:
      - ./:/etc/nginx
      - ./conf.d:/etc/nginx/conf.d
      - ./logs:/var/log/nginx
      - /home/core/data/www:/www
    ports:
      - '81:80'
    #   - "443:443"
    networks:
      share_network:
        ipv4_address: 172.19.5.1

networks:
  share_network:
    external: true
